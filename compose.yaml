services:
  portfel-gpw:
    build: .
    container_name: portfel-gpw
    restart: unless-stopped
    environment:
      QUOTES_ENABLED: ${QUOTES_ENABLED:-1}
      ACTIVITIY_START: ${ACTIVITY_START:-${ACTIVITIY_START:-0800}}
      ACTIVITY_END: ${ACTIVITY_END:-1800}
      ACTIVITIY_FREQS: ${ACTIVITY_FREQS:-${ACTIVITIY_FREQS:-5}}
      NONACTIVITY_FREQS: ${NONACTIVITY_FREQS:-300}
      TOKEN_LIMIT: ${TOKEN_LIMIT:-10000}
      BOSSA_QUOTES_API_KEY: ${BOSSA_QUOTES_API_KEY:-}
    expose:
      - "3000"
    volumes:
      - portfel-data:/app/data

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    depends_on:
      - portfel-gpw
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  portfel-data:
