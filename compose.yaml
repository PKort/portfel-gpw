services:
  portfel-gpw:
    build: .
    container_name: portfel-gpw
    restart: unless-stopped
    environment:
      QUOTES_ENABLED: ${QUOTES_ENABLED:-1}
      QUOTES_INTERVAL_SECONDS: ${QUOTES_INTERVAL_SECONDS:-300}
    expose:
      - "3000"
    volumes:
      - portfel-data:/app/data

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    depends_on:
      - portfel-gpw
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  portfel-data:
